<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Create Event - Event Management System
    </title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>


<nav class="navbar">

    <div class="logo">
        Event Management System
    </div>


    <div
        class="nav-links"
        id="userNav">

    </div>

</nav>


<section class="create-event-page">


    <div class="create-event-container">


        <div class="create-event-card">


            <p class="role-label">
                Organizer Module
            </p>


            <h1>
                Create New Event
            </h1>


            <p class="form-intro">
                Add your event details and
                publish it for attendees.
            </p>


            <form id="createEventForm">


                <div class="form-group">

                    <label for="eventTitle">
                        Event Title
                    </label>

                    <input
                        type="text"
                        id="eventTitle"
                        placeholder="Enter event title"
                        required>

                </div>


                <div class="form-row">


                    <div class="form-group">

                        <label for="eventDate">
                            Date
                        </label>

                        <input
                            type="date"
                            id="eventDate"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="eventTime">
                            Time
                        </label>

                        <input
                            type="time"
                            id="eventTime"
                            required>

                    </div>


                </div>


                <div class="form-group">

                    <label for="eventVenue">
                        Venue
                    </label>

                    <input
                        type="text"
                        id="eventVenue"
                        placeholder="Enter event venue"
                        required>

                </div>


                <div class="form-row">


                    <div class="form-group">

                        <label for="eventPrice">
                            Ticket Price (₹)
                        </label>

                        <input
                            type="number"
                            id="eventPrice"
                            min="0"
                            placeholder="Enter price"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="eventCapacity">
                            Capacity
                        </label>

                        <input
                            type="number"
                            id="eventCapacity"
                            min="1"
                            placeholder="Maximum attendees"
                            required>

                    </div>


                </div>


                <div class="form-group">

                    <label for="eventCategory">
                        Category
                    </label>

                    <select
                        id="eventCategory"
                        required>

                        <option value="">
                            Select category
                        </option>

                        <option>
                            Conference
                        </option>

                        <option>
                            Workshop
                        </option>

                        <option>
                            Cultural
                        </option>

                        <option>
                            Hackathon
                        </option>

                        <option>
                            Business
                        </option>

                        <option>
                            Music
                        </option>

                        <option>
                            Sports
                        </option>

                        <option>
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="eventDescription">
                        Description
                    </label>

                    <textarea
                        id="eventDescription"
                        rows="5"
                        placeholder="Describe your event..."
                        required></textarea>

                </div>


                <div class="checkbox-group">

                    <input
                        type="checkbox"
                        id="eventReminder">

                    <label for="eventReminder">
                        Enable reminders
                    </label>

                </div>


                <button
                    type="submit"
                    class="btn">

                    Create Event

                </button>


                <p
                    id="createEventMsg"
                    class="form-message">

                </p>


            </form>

        </div>

    </div>

</section>


<script src="scripts.js"></script>

</body>
</html>
