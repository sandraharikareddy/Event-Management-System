<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Event</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<nav class="navbar">

    <div class="logo">Event Management System</div>

    <div class="nav-links">

        <a href="user-dashboard.html">
            Dashboard
        </a>

        <a href="my-events.html">
            My Events
        </a>

        <a href="events.html">
            Events
        </a>

        <button onclick="logout()" class="logout-btn">
            Logout
        </button>

    </div>

</nav>

<section class="form-section">

    <div class="form-container">

        <h1>Create New Event</h1>

        <form id="createEventForm">

            <div class="form-group">
                <label>Event Title</label>

                <input
                    type="text"
                    id="eventTitle"
                    required>
            </div>

            <div class="form-group">
                <label>Date</label>

                <input
                    type="date"
                    id="eventDate"
                    required>
            </div>

            <div class="form-group">
                <label>Time</label>

                <input
                    type="time"
                    id="eventTime"
                    required>
            </div>

            <div class="form-group">
                <label>Venue</label>

                <input
                    type="text"
                    id="eventVenue"
                    required>
            </div>

            <div class="form-group">
                <label>Ticket Price</label>

                <input
                    type="number"
                    id="eventPrice"
                    min="0"
                    required>
            </div>

            <div class="form-group">
                <label>Capacity</label>

                <input
                    type="number"
                    id="eventCapacity"
                    min="1"
                    required>
            </div>

            <div class="form-group">
                <label>Description</label>

                <textarea
                    id="eventDescription"
                    rows="5"
                    required></textarea>
            </div>

            <div class="checkbox-group">

                <input
                    type="checkbox"
                    id="eventReminder">

                <label for="eventReminder">
                    Enable reminders
                </label>

            </div>

            <button type="submit" class="btn">
                Create Event
            </button>

            <p id="createEventMsg"></p>

        </form>

    </div>

</section>

<script src="scripts.js"></script>

</body>
</html>
