<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Login - Event Management System
    </title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>


<header>

    <div class="nav-container">

        <div class="logo">
            Event Management System
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Login
            </a>

            <a href="signup.html">
                Sign Up
            </a>

        </nav>

    </div>

</header>


<main class="form-container">

    <div class="form-card">

        <h1>
            Welcome Back
        </h1>

        <p class="form-intro">
            Login with one account.
            Your role automatically opens
            the correct dashboard.
        </p>


        <form id="loginForm">


            <label for="loginEmail">
                Email
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >


            <label for="loginPassword">
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="btn">

                Login

            </button>


            <p
                id="loginMsg"
                class="form-message">
            </p>


        </form>


        <p class="form-bottom">

            Don't have an account?

            <a href="signup.html">
                Sign Up
            </a>

        </p>

    </div>

</main>


<script src="scripts.js"></script>

</body>
</html>
